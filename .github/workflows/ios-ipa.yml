name: Fast iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.x
  SENTRY_DISABLE_AUTO_UPLOAD: "true"
  SENTRY_NO_UPLOAD: "1"
  EXPO_PUBLIC_FIREBASE_ANALYTICS_ENABLED: "false"

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Disable unused Firebase iOS autolinking
        run: |
          cat > react-native.config.js <<'EOF'
          module.exports = {
            dependencies: {
              '@react-native-firebase/app': {
                platforms: { ios: null },
              },
              '@react-native-firebase/analytics': {
                platforms: { ios: null },
              },
            },
          };
          EOF

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "pod install attempt ${attempt}"
            if pod install --project-directory=ios; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "pod install failed after 3 attempts"
          exit 1

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          cd ios
          echo "export NODE_BINARY=$(which node)" > .xcode.env.local

          WORKSPACE_PATH=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          WORKSPACE=$(basename "$WORKSPACE_PATH")
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Found workspace: $WORKSPACE, scheme: $SCHEME"

          set +e
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build > xcodebuild.log 2>&1
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "xcodebuild failed with exit code $EXIT_CODE"
            grep -i -E "error:|failed:|fatal:" xcodebuild.log | head -n 50 || true
            tail -n 100 xcodebuild.log
            exit "$EXIT_CODE"
          fi

      - name: Package unsigned IPA
        id: ios-artifact
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./package.json').version")
          IPA_NAME="zhihu-minus-minus-v${APP_VERSION}-unsigned.ipa"
          ARTIFACT_DIR="${RUNNER_TEMP}/ipa-build"
          APP_PATH=$(find build -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No compiled .app was found"
            exit 1
          fi

          mkdir -p "${ARTIFACT_DIR}/Payload"
          cp -R "$APP_PATH" "${ARTIFACT_DIR}/Payload/"
          python3 scripts/strip-ios-app.py "${ARTIFACT_DIR}/Payload/$(basename "$APP_PATH")"
          cd "$ARTIFACT_DIR"
          zip -qr "$IPA_NAME" Payload
          echo "path=${ARTIFACT_DIR}/${IPA_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ steps.ios-artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7
